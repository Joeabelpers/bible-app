<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!--
      maximum-scale / user-scalable=no stop Safari running its double-tap-zoom
      gesture recogniser, which is what was swallowing Apple Pencil strokes on
      the study page. viewport-fit=cover lets the page reach the screen edges.
    -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <meta name="theme-color" content="#F1E9DB" />
    <meta name="description" content="Daily Bible reading and study, following the Roberts Reading Plan." />

    <!-- Home-screen behaviour on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bible" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>The Bible Companion</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
